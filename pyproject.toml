[project]
name = "youtube-cli-uploader"
version = "0.2.0"
description = "A private-first YouTube Data API uploader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.179.0",
    "google-auth-oauthlib>=1.2.2",
]

[dependency-groups]
dev = ["ruff>=0.16.4"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/wakamex/youtube-cli-uploader"
Source = "https://github.com/wakamex/youtube-cli-uploader"

[project.scripts]
youtube-upload = "youtube_cli_uploader.upload:main"
youtube-authorize = "youtube_cli_uploader.authorize:main"
youtube-delete = "youtube_cli_uploader.delete:main"
